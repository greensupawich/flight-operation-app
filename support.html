<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- CSP: อนุญาตเฉพาะโดเมนที่ใช้จริง · เพิ่มโดเมนใหม่ (CDN/API) ต้องแก้ทุกหน้า -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://iljapjszrjuzjjbtxctu.supabase.co; media-src 'self' blob: https://iljapjszrjuzjjbtxctu.supabase.co; connect-src 'self' data: https://iljapjszrjuzjjbtxctu.supabase.co wss://iljapjszrjuzjjbtxctu.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Operation · ขอสนับสนุน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  :root{ --sr-red:#F6D3D3; --sr-red-b:#C0392B; --sr-yel:#FBEBB5; --sr-yel-b:#D4A017; --sr-grn:#D3EEDC; --sr-grn-b:#2E7D5B; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --sr-red:#4A2222; --sr-red-b:#E07B7B; --sr-yel:#463A14; --sr-yel-b:#E6C04A; --sr-grn:#163A27; --sr-grn-b:#5CBF94; }}
  :root[data-theme="dark"]{ --sr-red:#4A2222; --sr-red-b:#E07B7B; --sr-yel:#463A14; --sr-yel-b:#E6C04A; --sr-grn:#163A27; --sr-grn-b:#5CBF94; }
  .bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:10px;font-size:13px}
  .bar input,.bar select{width:auto;margin:0}
  .bar .sp{flex:1}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border-left:4px solid}
  .legend .lr{background:var(--sr-red);border-color:var(--sr-red-b)}
  .legend .ly{background:var(--sr-yel);border-color:var(--sr-yel-b)}
  .legend .lg{background:var(--sr-grn);border-color:var(--sr-grn-b)}
  .legend b{color:var(--ink)}
  .msg{font-size:12.5px;min-height:18px;color:var(--muted);margin-top:6px}
  .msg.err{color:var(--crit)} .msg.ok{color:var(--good)}
  .srwrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
  table.sr{border-collapse:collapse;width:100%;min-width:1280px;font-size:13px}
  table.sr th,table.sr td{border:1px solid var(--line);padding:4px 5px;vertical-align:middle}
  table.sr th{background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;text-align:center;white-space:nowrap}
  table.sr td input[type=text],table.sr td input[type=date],table.sr td select{width:100%;margin:0;font-size:12.5px;padding:5px 6px;
       border:1px solid transparent;background:transparent;border-radius:6px;color:var(--ink)}
  table.sr td input:hover,table.sr td select:hover{border-color:var(--line-strong)}
  table.sr td input:focus,table.sr td select:focus{border-color:var(--primary);background:var(--surface);outline:none}
  table.sr td.ck{text-align:center;width:52px}
  table.sr td.ck input{width:18px;height:18px;margin:0;cursor:pointer;accent-color:var(--primary)}
  table.sr td.ck input:disabled{cursor:default;opacity:.35}
  table.sr td.dt{width:140px} table.sr td.doc{width:120px} table.sr td.ag{width:170px} table.sr td.ow{width:170px}
  table.sr td.rk{min-width:180px}
  table.sr td.rm{width:64px;text-align:center}
  table.sr td.rm button{border:1px solid var(--line-strong);background:var(--surface);color:var(--crit);font-size:12px;font-weight:600;
       cursor:pointer;padding:3px 8px;border-radius:6px;white-space:nowrap}
  table.sr td.rm button:hover{background:var(--crit);color:#fff;border-color:var(--crit)}
  table.sr tr.r-red td{background:var(--sr-red)}   table.sr tr.r-red td:first-child{box-shadow:inset 4px 0 0 var(--sr-red-b)}
  table.sr tr.r-yel td{background:var(--sr-yel)}   table.sr tr.r-yel td:first-child{box-shadow:inset 4px 0 0 var(--sr-yel-b)}
  table.sr tr.r-grn td{background:var(--sr-grn)}   table.sr tr.r-grn td:first-child{box-shadow:inset 4px 0 0 var(--sr-grn-b)}
  table.sr tr.saving td{opacity:.7}
  table.sr td.empty{padding:30px;text-align:center;color:var(--faint)}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="page-head">
      <h1>ขอสนับสนุน</h1>
      <div class="sub">ตารางกรอกเอง · บันทึกอัตโนมัติเมื่อแก้ช่อง · เฉพาะผู้วางแผน / admin</div>
    </div>
    <div id="body">
      <div class="bar">
        <label for="month" style="margin:0">เดือน</label><input type="month" id="month">
        <button class="btn sm ghost" id="thisMonth">เดือนนี้</button>
        <label style="margin:0;display:inline-flex;align-items:center;gap:6px"><input type="checkbox" id="showAll"> แสดงทุกเดือน</label>
        <label style="margin:0;display:inline-flex;align-items:center;gap:6px"><input type="checkbox" id="onlyOpen"> เฉพาะที่ยังไม่เสร็จ</label>
        <input id="find" placeholder="ค้นหา ภารกิจ / เส้นทาง / หน่วยงาน / ผู้รับผิดชอบ / หมายเหตุ" style="width:280px;max-width:100%">
        <span class="sp"></span>
        <button class="btn sm primary" id="addRow">+ เพิ่มแถว</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="srwrap"><table class="sr">
        <thead>
          <tr><th rowspan="2">วันที่</th><th rowspan="2">ภารกิจ</th><th rowspan="2">เส้นทาง</th>
              <th colspan="2">ขอสนับสนุน</th><th colspan="3">ใบวิทยุ / เอกสาร</th>
              <th rowspan="2">ผู้รับผิดชอบ</th><th rowspan="2">หมายเหตุ</th><th rowspan="2">ลบ</th></tr>
          <tr><th>หน่วยงาน</th><th>เอกสาร</th><th>ทำ</th><th>เซ็น</th><th>ส่ง</th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="11" class="empty">กำลังโหลด…</td></tr></tbody>
      </table></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</main>

<script type="module">
  import { requireAuth, canPlan } from "./js/auth.js";
  import { renderTopbar } from "./js/ui.js";
  import { supabase } from "./js/supabase.js";
  import { esc } from "./js/missions.js";

  const profile = await requireAuth();
  if (!profile) throw new Error("no auth");
  renderTopbar(profile);
  // หน้านี้เฉพาะผู้วางแผน / admin (เมนูซ่อนสำหรับสิทธิ์อื่น · ฐานข้อมูลกันการอ่าน/เขียนด้วย RLS — migration_57)
  if (!canPlan(profile)) {
    document.getElementById("body").innerHTML = `<div class="empty">หน้านี้สำหรับผู้วางแผน / admin เท่านั้น</div>`;
    throw new Error("no permission");
  }

  // ---------- ข้อมูล ----------
  const DOCS = [["", "— เลือก —"], ["radio", "ใบวิทยุ"], ["other", "อื่นๆ"], ["none", "ไม่มี"]];
  const FIELDS = ["req_date", "mission", "route", "agency", "doc_type", "doc_made", "doc_signed", "doc_sent", "owner"];
  const pad = (n) => String(n).padStart(2, "0");
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const thisMonth = todayStr.slice(0, 7);
  const $ = (id) => document.getElementById(id);
  const msg = (t, cls = "") => { const m = $("msg"); m.className = "msg " + cls; m.textContent = t; };
  let rows = [];

  // สีแถว: แดง = ต้องมีเอกสาร (ใบวิทยุ/อื่นๆ) แต่ยังไม่ "ทำ" · เหลือง = ทำแล้ว แต่ เซ็น/ส่ง ยังไม่ครบ
  //        เขียว = ทำ+เซ็น+ส่ง ครบ หรือ เอกสาร = ไม่มี · ยังไม่เลือกเอกสาร = ไม่มีสี
  const colorOf = (r) => {
    if (r.doc_type === "none") return "grn";
    if (r.doc_type !== "radio" && r.doc_type !== "other") return "";
    if (!r.doc_made) return "red";
    return r.doc_signed && r.doc_sent ? "grn" : "yel";
  };

  // เรียงตามวันที่ จากใกล้วันนี้สุด → ไกลสุด (ผู้ใช้ขอ 6 พ.ย. 69)
  //  วันนี้/ข้างหน้า ก่อน (ใกล้ → ไกล) · ตามด้วยวันที่ผ่านมาแล้ว (เพิ่งผ่าน → นานแล้ว) · ไม่มีวันที่ = ท้ายสุด · วันเดียวกัน = ตามลำดับที่เพิ่ม
  const byDate = (a, b) => {
    const k = (r) => !r.req_date ? [2, ""] : r.req_date >= todayStr ? [0, r.req_date] : [1, r.req_date];
    const [ga, da] = k(a), [gb, db] = k(b);
    if (ga !== gb) return ga - gb;
    const c = ga === 1 ? db.localeCompare(da) : da.localeCompare(db);
    return c || String(a.created_at).localeCompare(String(b.created_at));
  };

  async function load() {
    const { data, error } = await supabase.from("support_requests").select("*")
      .order("req_date", { ascending: true, nullsFirst: false }).order("created_at");
    if (error) {
      const need = /does not exist|schema cache|Could not find/i.test(error.message || "");
      $("rows").innerHTML = `<tr><td colspan="11" class="empty">${need ? "ยังไม่มีตาราง — ต้องรัน db/migration_57_support_requests.sql ก่อน" : esc(error.message)}</td></tr>`;
      $("addRow").disabled = true;
      return;
    }
    rows = data || [];
    render();
  }

  function visible() {
    const all = $("showAll").checked, ym = $("month").value || thisMonth;
    const q = $("find").value.trim().toLowerCase(), open = $("onlyOpen").checked;
    return rows.filter((r) => (all || !r.req_date || r.req_date.slice(0, 7) === ym)
      && (!open || colorOf(r) !== "grn")
      && (!q || [r.mission, r.route, r.agency, r.owner, r.remark].some((v) => String(v || "").toLowerCase().includes(q))))
      .sort(byDate);
  }

  function rowHTML(r) {
    const c = colorOf(r), noDoc = r.doc_type === "none";
    const txt = (f, ph) => `<input type="text" data-f="${f}" value="${esc(r[f] || "")}" placeholder="${ph}">`;
    const ck = (f, label) => `<td class="ck"><input type="checkbox" data-f="${f}" ${r[f] ? "checked" : ""} ${noDoc ? "disabled" : ""}
        title="${label}${noDoc ? " (ไม่มีเอกสาร)" : ""}" aria-label="${label}"></td>`;
    return `<tr data-id="${r.id}" class="${c ? "r-" + c : ""}">
      <td class="dt"><input type="date" data-f="req_date" value="${r.req_date || ""}"></td>
      <td>${txt("mission", "ภารกิจ")}</td>
      <td>${txt("route", "เส้นทาง")}</td>
      <td class="ag">${txt("agency", "หน่วยงาน")}</td>
      <td class="doc"><select data-f="doc_type">${DOCS.map(([v, l]) => `<option value="${v}" ${(r.doc_type || "") === v ? "selected" : ""}>${l}</option>`).join("")}</select></td>
      ${ck("doc_made", "ทำ")}${ck("doc_signed", "เซ็น")}${ck("doc_sent", "ส่ง")}
      <td class="ow">${txt("owner", "ผู้รับผิดชอบ")}</td>
      <td class="rk">${txt("remark", "หมายเหตุ")}</td>
      <td class="rm"><button type="button" data-del title="ลบแถวนี้" aria-label="ลบแถว">🗑 ลบ</button></td></tr>`;
  }

  function render() {
    const list = visible();
    const cnt = { red: 0, yel: 0, grn: 0, "": 0 };
    list.forEach((r) => cnt[colorOf(r)]++);
    $("legend").innerHTML = `
      <span><i class="lr"></i>ต้องมีเอกสาร ยังไม่ทำ <b>${cnt.red}</b></span>
      <span><i class="ly"></i>ทำแล้ว เซ็น/ส่ง ยังไม่ครบ <b>${cnt.yel}</b></span>
      <span><i class="lg"></i>ครบแล้ว / ไม่มีเอกสาร <b>${cnt.grn}</b></span>
      ${cnt[""] ? `<span>ยังไม่เลือกเอกสาร <b>${cnt[""]}</b></span>` : ""}
      <span>· ${list.length} รายการ${$("showAll").checked ? " (ทุกเดือน)" : ""}</span>`;
    $("rows").innerHTML = list.length ? list.map(rowHTML).join("")
      : `<tr><td colspan="11" class="empty">ยังไม่มีรายการ — กด "+ เพิ่มแถว"</td></tr>`;
  }

  // ---------- บันทึก ----------
  async function saveField(tr, f, value) {
    const id = tr.dataset.id, r = rows.find((x) => x.id === id);
    if (!r || r[f] === value) return;
    const patch = { [f]: value, updated_at: new Date().toISOString(), updated_by: profile.id };
    tr.classList.add("saving");
    const { error } = await supabase.from("support_requests").update(patch).eq("id", id);
    tr.classList.remove("saving");
    if (error) { msg("บันทึกไม่สำเร็จ: " + error.message, "err"); render(); return; }
    Object.assign(r, patch);
    msg("บันทึกแล้ว", "ok");
    // สีแถว/ช่องติ๊กเปลี่ยนตามเอกสาร → วาดเฉพาะแถวนี้ใหม่ (ไม่ทำให้ช่องอื่นเสียโฟกัส) · ย้ายเดือน/เรียงใหม่เมื่อเปลี่ยนวันที่
    if (f === "req_date") return render();
    const fresh = document.createElement("tbody");
    fresh.innerHTML = rowHTML(r);
    const nt = fresh.firstElementChild;
    if (["doc_type", "doc_made", "doc_signed", "doc_sent"].includes(f)) {
      const keep = document.activeElement?.dataset?.f;
      tr.replaceWith(nt);
      if (keep) nt.querySelector(`[data-f="${keep}"]`)?.focus();
    } else tr.className = nt.className;
    if ($("onlyOpen").checked && colorOf(r) === "grn") return render();   // เสร็จแล้ว → หายจากมุมมอง "ยังไม่เสร็จ"
    updateLegend();
  }
  function updateLegend() {
    const list = visible(), cnt = { red: 0, yel: 0, grn: 0, "": 0 };
    list.forEach((r) => cnt[colorOf(r)]++);
    const b = $("legend").querySelectorAll("b");
    if (b.length >= 3) { b[0].textContent = cnt.red; b[1].textContent = cnt.yel; b[2].textContent = cnt.grn; }
  }

  const rowsEl = $("rows");
  rowsEl.addEventListener("change", (e) => {
    const el = e.target, f = el.dataset.f, tr = el.closest("tr[data-id]");
    if (!f || !tr) return;
    let v = el.type === "checkbox" ? el.checked : el.value.trim();
    if (f === "doc_type" || f === "req_date") v = v || null;
    saveField(tr, f, v);
  });
  rowsEl.addEventListener("keydown", (e) => {               // Enter ในช่องข้อความ = บันทึก (ออกจากช่อง)
    if (e.key === "Enter" && e.target.matches("input[type=text]")) e.target.blur();
  });
  rowsEl.addEventListener("click", async (e) => {
    if (!e.target.closest("[data-del]")) return;
    const tr = e.target.closest("tr[data-id]"), r = rows.find((x) => x.id === tr.dataset.id);
    if (!confirm(`ลบแถว "${r?.mission || "(ไม่มีชื่อภารกิจ)"}"${r?.req_date ? ` วันที่ ${r.req_date}` : ""}?`)) return;
    const { error } = await supabase.from("support_requests").delete().eq("id", tr.dataset.id);
    if (error) return msg("ลบไม่สำเร็จ: " + error.message, "err");
    rows = rows.filter((x) => x.id !== tr.dataset.id);
    msg("ลบแล้ว", "ok"); render();
  });

  $("addRow").addEventListener("click", async () => {
    const ym = $("month").value || thisMonth;
    const date = $("showAll").checked || ym === thisMonth ? todayStr : `${ym}-01`;
    const { data, error } = await supabase.from("support_requests").insert({ req_date: date }).select().single();
    if (error) return msg("เพิ่มแถวไม่สำเร็จ: " + error.message, "err");
    rows.push(data);
    $("find").value = ""; $("onlyOpen").checked = false;
    render();
    rowsEl.querySelector(`tr[data-id="${data.id}"] [data-f="mission"]`)?.focus();
    msg("เพิ่มแถวแล้ว — กรอกได้เลย", "ok");
  });

  // ---------- ตัวกรอง ----------
  $("month").value = thisMonth;
  $("month").addEventListener("change", render);
  $("thisMonth").addEventListener("click", () => { $("month").value = thisMonth; $("showAll").checked = false; render(); });
  $("showAll").addEventListener("change", render);
  $("onlyOpen").addEventListener("change", render);
  $("find").addEventListener("input", render);
  load();
</script>
</body>
</html>
