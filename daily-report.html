<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- CSP: อนุญาตเฉพาะโดเมนที่ใช้จริง · เพิ่มโดเมนใหม่ (CDN/API) ต้องแก้ทุกหน้า -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://iljapjszrjuzjjbtxctu.supabase.co; media-src 'self' blob: https://iljapjszrjuzjjbtxctu.supabase.co; connect-src 'self' data: https://iljapjszrjuzjjbtxctu.supabase.co wss://iljapjszrjuzjjbtxctu.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Operation · รายงานประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  main .wrap{max-width:820px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .bar .sp{flex:1}
  .rep-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
  #txt{width:100%;min-height:420px;resize:vertical;font-size:15px;line-height:1.65;font-family:"IBM Plex Sans Thai",sans-serif;
       white-space:pre-wrap}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .tools .msg{font-size:13px;color:var(--good);font-weight:600}
  .stat{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;font-size:12.5px}
  .stat span{border-radius:6px;padding:2px 9px;font-weight:600}
  .stat .done{background:var(--good-soft);color:var(--good)}
  .stat .pending{background:var(--accent-soft);color:var(--warn)}
  .stat .cancelled{background:var(--crit-soft);color:var(--crit)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="page-head">
      <h1>รายงานประจำวัน</h1>
      <div class="sub">ข้อความรายงานภารกิจการบินของวัน สำหรับคัดลอกไปรายงานต่อ</div>
    </div>

    <div class="bar">
      <button class="btn sm" id="prevDay" title="วันก่อนหน้า">←</button>
      <input type="date" id="datePick" style="width:auto">
      <button class="btn sm" id="nextDay" title="วันถัดไป">→</button>
      <button class="btn sm ghost" id="todayBtn">วันนี้</button>
      <span class="sp"></span>
      <a class="btn sm ghost" href="home.html">หน้าหลัก</a>
    </div>

    <div class="rep-card">
      <div class="stat" id="stat"></div>
      <textarea id="txt" spellcheck="false" aria-label="ข้อความรายงาน">กำลังโหลด…</textarea>
      <div class="tools">
        <button class="btn primary" id="copyBtn">📋 คัดลอกข้อความ</button>
        <button class="btn ghost" id="regenBtn" title="สร้างข้อความใหม่จากข้อมูลล่าสุด (ล้างที่แก้เอง)">↻ สร้างใหม่</button>
        <span class="msg" id="msg"></span>
      </div>
      <div class="hint">
        สร้างจากภารกิจของวันนั้น (ไม่นับ STBY ทั่วไป) เรียงตามกระดานหน้าหลัก ·
        รายงานหลังบินแล้ว → <b>-ปฏิบัติภารกิจเรียบร้อย</b> · ยังไม่รายงาน → <b>-อยู่ระหว่างปฏิบัติภารกิจ</b> ·
        ยกเลิก → <b>-ยกเลิกภารกิจ</b> · แก้ข้อความในกล่องก่อนคัดลอกได้
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { renderTopbar } from "./js/ui.js";
  import { loadMissionsByDate } from "./js/missions.js";
  import { buildDailyReport, reportMissions, resultOf } from "./js/daily-report.js";

  const profile = await requireAuth();
  if (profile) {
    renderTopbar(profile);
    const $ = (id) => document.getElementById(id);
    const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const qd = new URLSearchParams(location.search).get("date");
    let view = qd && /^\d{4}-\d{2}-\d{2}$/.test(qd) ? new Date(qd + "T00:00:00") : new Date();
    view = new Date(view.getFullYear(), view.getMonth(), view.getDate());

    async function refresh() {
      const date = ymd(view);
      $("datePick").value = date;
      history.replaceState(null, "", `?date=${date}`);
      $("msg").textContent = "";
      const all = await loadMissionsByDate(date);
      if (ymd(view) !== date) return;               // เปลี่ยนวันระหว่างโหลด
      const list = reportMissions(all);
      const n = { done: 0, pending: 0, cancelled: 0 };
      list.forEach((m) => n[resultOf(m)]++);
      $("stat").innerHTML = list.length
        ? `<span class="done">เรียบร้อย ${n.done}</span><span class="pending">ระหว่างปฏิบัติ ${n.pending}</span>${n.cancelled ? `<span class="cancelled">ยกเลิก ${n.cancelled}</span>` : ""}`
        : "";
      $("txt").value = buildDailyReport(date, all);
    }

    const shift = (k) => { view = new Date(view.getFullYear(), view.getMonth(), view.getDate() + k); refresh(); };
    $("prevDay").addEventListener("click", () => shift(-1));
    $("nextDay").addEventListener("click", () => shift(1));
    $("todayBtn").addEventListener("click", () => { const t = new Date(); view = new Date(t.getFullYear(), t.getMonth(), t.getDate()); refresh(); });
    $("datePick").addEventListener("change", (e) => {
      if (!e.target.value) return;
      const [y, mo, da] = e.target.value.split("-").map(Number);
      view = new Date(y, mo - 1, da); refresh();
    });
    $("regenBtn").addEventListener("click", refresh);
    $("copyBtn").addEventListener("click", async () => {
      const t = $("txt");
      try { await navigator.clipboard.writeText(t.value); }
      catch { t.select(); document.execCommand("copy"); }          // เบราว์เซอร์ที่ไม่ให้ใช้ clipboard API
      $("msg").textContent = "✓ คัดลอกแล้ว";
      setTimeout(() => { $("msg").textContent = ""; }, 2500);
    });

    refresh();
  }
</script>
</body>
</html>
