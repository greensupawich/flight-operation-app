<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- CSP: อนุญาตเฉพาะโดเมนที่ใช้จริง · เพิ่มโดเมนใหม่ (CDN/API) ต้องแก้ทุกหน้า -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://esm.sh https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://iljapjszrjuzjjbtxctu.supabase.co; media-src 'self' blob: https://iljapjszrjuzjjbtxctu.supabase.co; connect-src 'self' data: https://iljapjszrjuzjjbtxctu.supabase.co wss://iljapjszrjuzjjbtxctu.supabase.co https://esm.sh https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; worker-src 'self' blob: https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Operation · พ.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  main .wrap{max-width:none}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .bar .month{font-family:"Bai Jamjuree",sans-serif;font-weight:600;font-size:17px;min-width:170px;text-align:center}
  .bar .sp{flex:1}
  .legend{font-size:12.5px;color:var(--muted)}
  .msg{font-size:12.5px;min-height:18px;color:var(--muted)}
  .msg.err{color:var(--crit)} .msg.ok{color:var(--good)}

  .pmwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
          max-height:calc(100vh - 210px);box-shadow:var(--shadow)}
  table.pm{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
  .pm th,.pm td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;
                white-space:nowrap;background:var(--surface)}
  .pm thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-weight:600;padding:4px 2px;
               font-variant-numeric:tabular-nums}
  .pm thead tr:nth-child(2) th{top:27px;font-weight:500;color:var(--muted);font-size:11.5px}
  .pm .name{position:sticky;left:0;z-index:2;text-align:left;padding:4px 10px;min-width:170px;max-width:200px;
            white-space:normal;line-height:1.35}
  .pm .name .code{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
  .pm .lab{position:sticky;left:170px;z-index:2;color:var(--muted);font-size:11.5px;padding:0 6px;min-width:58px}
  .pm thead .name,.pm thead .lab{z-index:4}
  .pm td.d{min-width:46px;height:24px;font-variant-numeric:tabular-nums}
  .pm .off{background:color-mix(in srgb,var(--surface-2) 70%,var(--line) 30%)}
  .pm thead th.off{color:var(--crit)}
  .pm tr.r0 td{border-top:2px solid var(--line-strong)}
  .pm tr.r0 td.cnt{font-weight:700;color:var(--primary)}
  .pm td.hrs{font-size:11.5px;color:var(--ink)}
  .pm td.hrs .pend{color:var(--warn)}
  .pm td.note input{width:100%;min-width:44px;border:0;background:transparent;font:inherit;font-size:11.5px;
                    padding:3px 4px;text-align:center;color:var(--ink);border-radius:0}
  .pm td.note input:focus{outline:2px solid var(--accent);background:var(--surface)}
  .pm td.note input.saving{background:var(--accent-soft)}
  .pm td.note input.err{background:var(--crit-soft)}
  .pm td.note span{display:block;font-size:11.5px;padding:3px 4px}
  .pm .tot{font-weight:700;min-width:62px;position:sticky;right:0;z-index:2}
  .pm thead .tot{z-index:4}
  .empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="page-head">
      <h1>พ.</h1>
      <div class="sub">นักบินทุกคน (IP · P · CP) × วันในเดือน — แต่ละคน 3 แถว: จำนวนเที่ยว · ชม.บินแต่ละเที่ยว · หมายเหตุ</div>
    </div>

    <div class="bar">
      <button class="btn sm ghost" id="prev" aria-label="เดือนก่อน">‹</button>
      <div class="month" id="monthLabel"></div>
      <button class="btn sm ghost" id="next" aria-label="เดือนถัดไป">›</button>
      <button class="btn sm ghost" id="thisMonth">เดือนนี้</button>
      <input type="month" id="monthPick" style="width:auto">
      <span class="sp"></span>
      <button class="btn sm primary" id="xlsxBtn">📊 Export Excel</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="msg" id="msg"></div>
    <div class="pmwrap" id="wrap"><div class="empty">กำลังโหลด…</div></div>
  </div>
</main>

<script type="module">
  import { requireAuth, canPlan } from "./js/auth.js";
  import { renderTopbar } from "./js/ui.js";
  import { loadMonth, saveNote, monthTableHTML, exportMonthXlsx, ymd, TH_MONTH } from "./js/pilot-month.js";

  const profile = await requireAuth();
  if (profile) {
    renderTopbar(profile);
    const planner = canPlan(profile);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const msg = document.getElementById("msg");
    const say = (t, cls = "") => { msg.className = "msg " + cls; msg.textContent = t; };

    // เดือนที่ดู: ?ym=2026-10 หรือเดือนปัจจุบัน
    const qs = new URLSearchParams(location.search).get("ym");
    const now = new Date();
    let y = now.getFullYear(), m0 = now.getMonth();
    if (/^\d{4}-\d{2}$/.test(qs || "")) { y = Number(qs.slice(0, 4)); m0 = Number(qs.slice(5)) - 1; }
    let data = null;

    function render() {
      const { days, pilots } = data;
      document.getElementById("monthLabel").textContent = `${TH_MONTH[m0]} ${y + 543}`;
      document.getElementById("monthPick").value = `${y}-${String(m0 + 1).padStart(2, "0")}`;
      document.getElementById("legend").textContent =
        `${pilots.length} คน · นับเที่ยวจากภารกิจที่มีชื่อในตำแหน่งนักบิน (ไม่รวม STBY / ยกเลิก) · ชม. จากรายงานหลังบิน ("-" = ยังไม่รายงาน)` +
        (planner ? " · คลิกช่องหมายเหตุเพื่อพิมพ์ (บันทึกอัตโนมัติ)" : "");
      if (data.notesMissing) say("ยังกรอกหมายเหตุไม่ได้ — ต้องรัน db/migration_33_crew_day_notes.sql ก่อน", "err");

      const wrap = document.getElementById("wrap");
      if (!pilots.length) { wrap.innerHTML = `<div class="empty">ไม่มีนักบินในทะเบียน</div>`; return; }

      const editable = planner && !data.notesMissing;
      wrap.innerHTML = monthTableHTML(data, { editable });
      if (editable) wireNotes(wrap);
    }

    // บันทึกหมายเหตุเมื่อออกจากช่อง / กด Enter
    function wireNotes(wrap) {
      wrap.querySelectorAll("td.note input").forEach((inp) => {
        inp.dataset.saved = inp.value;
        const commit = async () => {
          const val = inp.value.trim();
          if (val === inp.dataset.saved) return;
          inp.classList.add("saving"); inp.classList.remove("err");
          const day = Number(inp.dataset.day);
          const err = await saveNote(inp.dataset.crew, ymd(y, m0, day), val);
          inp.classList.remove("saving");
          if (err) { inp.classList.add("err"); say("บันทึกไม่สำเร็จ: " + err.message, "err"); return; }
          inp.dataset.saved = val;
          const key = `${inp.dataset.crew}|${day}`;
          if (val) data.noteMap.set(key, val); else data.noteMap.delete(key);
          say(`บันทึกแล้ว · วันที่ ${day}`, "ok");
        };
        inp.addEventListener("blur", commit);
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
          if (e.key === "Escape") { inp.value = inp.dataset.saved; inp.blur(); }
        });
      });
    }

    async function refresh() {
      say("");
      document.getElementById("wrap").innerHTML = `<div class="empty">กำลังโหลด…</div>`;
      history.replaceState(null, "", `?ym=${y}-${String(m0 + 1).padStart(2, "0")}`);
      try {
        data = await loadMonth(y, m0);
        render();
      } catch (e) {
        document.getElementById("wrap").innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message || e)}</div>`;
      }
    }
    const shift = (n) => { const d = new Date(y, m0 + n, 1); y = d.getFullYear(); m0 = d.getMonth(); refresh(); };
    document.getElementById("prev").addEventListener("click", () => shift(-1));
    document.getElementById("next").addEventListener("click", () => shift(1));
    document.getElementById("thisMonth").addEventListener("click", () => { y = now.getFullYear(); m0 = now.getMonth(); refresh(); });
    document.getElementById("monthPick").addEventListener("change", (e) => {
      if (!/^\d{4}-\d{2}$/.test(e.target.value)) return;
      y = Number(e.target.value.slice(0, 4)); m0 = Number(e.target.value.slice(5)) - 1; refresh();
    });

    document.getElementById("xlsxBtn").addEventListener("click", async (e) => {
      if (!data) return;
      const btn = e.currentTarget; const label = btn.textContent;
      btn.disabled = true; btn.textContent = "กำลังสร้างไฟล์…";
      try { const f = await exportMonthXlsx(data); say(`ดาวน์โหลด ${f} แล้ว`, "ok"); }
      catch (err) { say("Export Excel ไม่สำเร็จ: " + (err.message || err), "err"); }
      finally { btn.disabled = false; btn.textContent = label; }
    });

    refresh();
  }
</script>
</body>
</html>
